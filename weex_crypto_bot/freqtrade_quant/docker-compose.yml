---
services:
  freqtrade:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: freqtrade
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "8080:8080"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --config /freqtrade/user_data/config-private.json
      --strategy weex_futures_quant

  freqtrade-elite:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: freqtrade-elite
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "8081:8081"
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade_elite.log
      --db-url sqlite:////freqtrade/user_data/tradesv3_elite.sqlite
      --config /freqtrade/user_data/config-elite.json
      --config /freqtrade/user_data/config-private-elite.json
      --strategy weex_futures_quant
